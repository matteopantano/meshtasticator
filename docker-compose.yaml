services:
  # ============================================================
  # RX (Receiver / Gateway) Node
  # ============================================================
  meshtasticd-rx:
    image: meshtastic/meshtasticd:latest
    container_name: meshtasticd-rx
    restart: unless-stopped
    command: [ "meshtasticd", "-s", "-c", "/etc/meshtasticd/config.yaml" ]
    volumes:
      - ./meshtasticd-config/config.yaml:/etc/meshtasticd/config.yaml:ro
      - meshtasticd-data-rx:/root/.portduino
    networks:
      - meshtastic

  ws-proxy-rx:
    image: python:3.11-slim
    container_name: meshtastic-ws-proxy-rx
    restart: unless-stopped
    environment:
      - MESHTASTIC_HOST=meshtasticd-rx
      - MESHTASTIC_PORT=4403
    command: sh -c "pip install tornado && python -u /app/proxy.py"
    volumes:
      - ./meshtasticd-config/proxy.py:/app/proxy.py:ro
    ports:
      - "4403:4403" # web interface
      - "4404:4404" # websocket API
    depends_on:
      - meshtasticd-rx
    networks:
      - meshtastic

  # ============================================================
  # TX (Transmitter / Remote) Node
  # ============================================================
  meshtasticd-tx:
    image: meshtastic/meshtasticd:latest
    container_name: meshtasticd-tx
    restart: unless-stopped
    command: [ "meshtasticd", "-s", "-c", "/etc/meshtasticd/config.yaml" ]
    volumes:
      - ./meshtasticd-config/config.yaml:/etc/meshtasticd/config.yaml:ro
      - meshtasticd-data-tx:/root/.portduino
    networks:
      - meshtastic

  ws-proxy-tx:
    image: python:3.11-slim
    container_name: meshtastic-ws-proxy-tx
    restart: unless-stopped
    environment:
      - MESHTASTIC_HOST=meshtasticd-tx
      - MESHTASTIC_PORT=4403
    command: sh -c "pip install tornado && python -u /app/proxy.py"
    volumes:
      - ./meshtasticd-config/proxy.py:/app/proxy.py:ro
    ports:
      - "4405:4403" # web interface
      - "4406:4404" # websocket API
    depends_on:
      - meshtasticd-tx
    networks:
      - meshtastic

  # ============================================================
  # Simulated RF TCP Cross-Routing Bridge
  # ============================================================
  sim-radio-bridge:
    image: python:3.11-slim
    container_name: meshtastic-sim-radio-bridge
    restart: unless-stopped
    environment:
      - RX_MUX_HOST=ws-proxy-rx
      - RX_MUX_PORT=4404
      - TX_MUX_HOST=ws-proxy-tx
      - TX_MUX_PORT=4404
    command: sh -c "pip install meshtastic && python -u /app/sim_rf_bridge.py"
    volumes:
      - ./meshtasticd-config/sim_rf_bridge.py:/app/sim_rf_bridge.py:ro
    depends_on:
      - ws-proxy-rx
      - ws-proxy-tx
    networks:
      - meshtastic

  # ============================================================
  # Unified Web UI Frontend
  # ============================================================
  web:
    image: ghcr.io/meshtastic/web:latest
    container_name: meshtastic-web
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - meshtasticd-rx
      - ws-proxy-rx
    networks:
      - meshtastic

  # ============================================================
  # MQTT Broker (Mosquitto)
  # ============================================================
  # Required for the fully-simulated flow (mqtt_bridge.py / shelly_simulator.py
  # default to localhost:1883, and provision_nodes.py --sim points the nodes'
  # native MQTT client at the "mqtt-broker" hostname).
  # For hybrid tests where a physical ESP32 (192.168.4.1:1883) is the broker,
  # simply stop this one:  docker compose stop mqtt-broker
  mqtt-broker:
    image: eclipse-mosquitto:2.0
    container_name: mosquitto-broker
    restart: unless-stopped
    volumes:
      - ./meshtasticd-config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "1883:1883"
    networks:
      - meshtastic

volumes:
  meshtasticd-data-rx:
  meshtasticd-data-tx:

networks:
  meshtastic:
