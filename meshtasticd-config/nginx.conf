server {
  listen 8080;
  server_name localhost;

  root /usr/share/nginx/html;
  index index.html;

  # Reverse proxy API & WebSockets to ws-proxy container
  location /api/v1/ {
    proxy_pass http://ws-proxy-rx:4403/api/v1/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
  }

  location ~* \.(?:js|jsx|mjs|ts|tsx|css|png|jpg|jpeg|gif|ico|webp|avif|svg|ttf|otf|woff|woff2|map)$ {
    access_log off;
    etag on;
    expires 3M;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location = /index.html {
    etag on;
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  error_page 500 502 503 504 /50x.html;
  location = /50x.html { internal; }
}
